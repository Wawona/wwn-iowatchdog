name: CI

on:
  push:
    branches: [development, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build wwn-iowatchdog
        run: nix build .#wwn-iowatchdog -L
      - name: File check
        run: file result/bin/wwn-iowatchdog
